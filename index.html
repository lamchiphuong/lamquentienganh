<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Làm Quen Tiếng Anh - Trẻ Mẫu Giáo</title>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/13562/13562994.png">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/13562/13562994.png">
<style>
  :root{
    --bg:#f3f4fa; --card:#ffffff; --text:#1b1f2e; --muted:#6c7389; --line:#e6e8f2;
    --p1:#6366f1; --p2:#8b5cf6; --danger:#e11d48;
    --shadow:0 1px 2px rgba(20,24,50,.05),0 6px 20px rgba(20,24,50,.06);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f111a; --card:#181b27; --text:#eceef7; --muted:#9097ae; --line:#272b3d;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
  .ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  /* Header */
  header{display:flex;align-items:center;gap:12px;padding:0 22px;height:58px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--p1),var(--p2));display:grid;place-items:center;color:#fff}
  .logo .ic{width:17px;height:17px}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--bg);padding:4px 10px;border-radius:99px}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:#10b981}
  .pill.err{color:var(--danger)} .pill.err::before{background:var(--danger)}
  .pill.busy::before{background:#f59e0b}

  /* Buttons (nhỏ gọn) */
  .btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;font:inherit;font-size:13px;font-weight:500;
    border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--p1);color:var(--p1)}
  .btn.primary{background:linear-gradient(135deg,var(--p1),var(--p2));border:none;color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.35)}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.dashed{border-style:dashed;color:var(--muted);background:transparent}
  .icon-btn{width:28px;height:28px;border:none;background:transparent;color:var(--muted);border-radius:7px;display:inline-grid;place-items:center;cursor:pointer;transition:.15s}
  .icon-btn:hover{background:var(--bg);color:var(--p1)}
  .icon-btn.del:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}

  /* Layout */
  .layout{display:flex;gap:22px;max-width:1120px;margin:22px auto;padding:0 18px;align-items:flex-start}
  aside{width:230px;flex-shrink:0;position:sticky;top:80px}
  .side-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
  .side-head h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .class-item{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:4px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:.15s}
  .class-item:hover{background:var(--card)}
  .class-item.active{background:var(--card);border-color:var(--line);box-shadow:var(--shadow)}
  .avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:hsl(var(--h) 65% 55%);flex-shrink:0}
  .class-item .t{min-width:0}
  .class-item .t b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .class-item .t small{color:var(--muted);font-size:12px}
  .class-item.active .t b{color:var(--p1)}
  main{flex:1;min-width:0}

  /* Hero lớp */
  .hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 24px;border-radius:18px;margin-bottom:20px;color:#fff;
    background:linear-gradient(120deg,var(--p1),var(--p2) 60%,#c084fc);box-shadow:0 10px 30px rgba(99,102,241,.3);position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero .info{flex:1;min-width:180px;position:relative;z-index:1}
  .hero h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
  .hero p{margin:4px 0 0;opacity:.85;font-size:13.5px}
  .hero .acts{display:flex;gap:6px;align-items:center;position:relative;z-index:1}
  .hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);color:#fff}
  .hero .btn:hover{background:rgba(255,255,255,.28);color:#fff}
  .hero .btn.white{background:#fff;color:var(--p1);border:none;font-weight:600}

  /* Unit */
  .unit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
  .unit-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;
    background:linear-gradient(90deg,hsl(var(--h) 80% 55% / .10),transparent 70%);border-left:5px solid hsl(var(--h) 70% 55%)}
  .badge{min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:hsl(var(--h) 70% 55%);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center}
  .unit-head h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .count{font-size:12px;font-weight:600;color:hsl(var(--h) 60% 40%);background:hsl(var(--h) 80% 55% / .14);padding:3px 9px;border-radius:99px}
  @media (prefers-color-scheme: dark){ .count{color:hsl(var(--h) 80% 75%)} }
  .chev{color:var(--muted);transition:.2s}
  .unit.collapsed .chev{transform:rotate(-90deg)}
  .unit.collapsed .unit-body{display:none}
  .unit-head .tools{display:flex}

  .lesson{display:flex;align-items:center;gap:12px;padding:9px 16px 9px 20px;border-top:1px solid var(--line);transition:.12s}
  .lesson:hover{background:color-mix(in srgb,var(--p1) 5%,transparent)}
  .num{width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:12px;font-weight:600;display:grid;place-items:center;flex-shrink:0}
  .lesson a.name{flex:1;min-width:0;text-decoration:none;color:var(--text)}
  .lesson a.name b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lesson a.name:hover b{color:var(--p1)}
  .lesson a.name small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:4px}
  .lesson .tools{display:flex;opacity:0;transition:.15s}
  .lesson:hover .tools{opacity:1}
  @media (hover:none){ .lesson .tools{opacity:1} }
  .tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;flex-shrink:0}
  .tag .ic{width:13px;height:13px}
  .tag.game{color:#7c3aed;background:rgba(139,92,246,.14)}
  .tag.video{color:#e11d48;background:rgba(244,63,94,.13)}
  @media (prefers-color-scheme: dark){ .tag.game{color:#c4b5fd} .tag.video{color:#fda4af} }
  .none{padding:12px 20px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
  .unit-foot{padding:10px 16px;border-top:1px solid var(--line)}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);text-align:center;padding:44px 16px}

  /* Dialog */
  dialog{border:none;border-radius:16px;padding:22px;width:min(420px,92vw);background:var(--card);color:var(--text);box-shadow:0 24px 60px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(10,12,25,.5);backdrop-filter:blur(2px)}
  dialog h3{margin:0 0 4px;font-size:17px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input{width:100%;font:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
  input:focus{outline:2px solid color-mix(in srgb,var(--p1) 60%,transparent);outline-offset:-1px;border-color:transparent}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

  #toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:#1b1f2e;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:3000}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:760px){
    .layout{flex-direction:column;gap:14px}
    aside{width:100%;position:static}
    #classList{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
    .class-item{flex-shrink:0;margin:0}
    .hero h2{font-size:23px}
    .viewer{align-items:flex-end}
    .v-panel{width:100vw;height:92vh;height:92dvh;border-radius:16px 16px 0 0}
  }

  /* Khung xem link (iframe) */
  .viewer{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(10,12,25,.55);backdrop-filter:blur(2px)}
  .viewer.open{display:flex}
  .v-panel{width:80vw;height:80vh;background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .v-bar{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
  .v-bar b{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v-bar .btn{height:28px}
  .v-body{position:relative;flex:1;background:var(--bg)}
  .v-hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-size:13px}
  .v-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}

  /* Đồng hồ đếm ngược nổi */
  .tm{position:fixed;right:22px;bottom:22px;z-index:2000;display:flex;flex-direction:column;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
  .tm-clock{position:relative;width:150px;height:150px;border-radius:50%;background:var(--card);box-shadow:0 10px 30px rgba(20,24,50,.28),0 0 0 1px var(--line);cursor:grab;touch-action:none;transition:width .2s,height .2s}
  .tm.dragging .tm-clock{cursor:grabbing}
  .tm-clock svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
  .tm-track{fill:none;stroke:var(--line);stroke-width:9}
  .tm-prog{fill:none;stroke:var(--p1);stroke-width:9;stroke-linecap:round;transition:stroke .2s}
  .tm-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-top:6px}
  .tm-time{font-size:29px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
  .tm-go{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));display:grid;place-items:center;box-shadow:0 2px 8px rgba(99,102,241,.4)}
  .tm-go:hover{filter:brightness(1.1)}
  .tm-go .ic{width:16px;height:16px}
  .tm-min{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:24px;height:20px}
  .tm-set{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:9px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;align-items:center}
  .tm-presets{display:flex;gap:5px}
  .tm-chip{height:26px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .tm-chip:hover,.tm-chip.on{border-color:var(--p1);color:var(--p1)}
  .tm-custom{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .tm-custom input{width:58px;height:28px;padding:0 6px;text-align:center;font-weight:700;font-size:16px}
  .tm.mini .tm-clock{width:72px;height:72px;cursor:pointer}
  .tm.mini .tm-time{font-size:15px}
  .tm.mini .tm-center{padding-top:0}
  .tm.mini .tm-go,.tm.mini .tm-min,.tm.mini .tm-set{display:none}
  .tm.done .tm-clock{animation:tmRing .6s ease-in-out infinite alternate}
  .tm.done .tm-prog{stroke:var(--danger)}
  @keyframes tmRing{from{transform:scale(1)}to{transform:scale(1.07)}}
  @media(max-width:760px){
    .tm{right:10px;bottom:10px;gap:6px}
    .tm-clock{width:112px;height:112px}
    .tm-center{gap:4px;padding-top:4px}
    .tm-time{font-size:22px}
    .tm-go{width:28px;height:28px}
    .tm-go .ic{width:14px;height:14px}
    .tm-min{top:9px;height:16px}
    .tm-set{padding:6px 8px;gap:6px;border-radius:14px}
    .tm-chip{height:24px;padding:0 8px;font-size:12px}
    .tm-custom input{width:50px;height:26px}
    .tm.mini .tm-clock{width:56px;height:56px}
    .tm.mini .tm-time{font-size:12px}
  }
</style>
</head>
<body>
<header>
  <div class="logo" id="logoIc"></div>
  <h1>Làm Quen Tiếng Anh - Trẻ Mẫu Giáo</h1>
  <span class="pill busy" id="status">Đang tải…</span>
  <button class="icon-btn" id="refreshBtn" title="Tải lại"></button>
</header>

<div class="layout">
  <aside>
    <div class="side-head">
      <h2>Lớp học</h2>
      <button class="btn primary" id="addClassBtn"></button>
    </div>
    <div id="classList"></div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div id="dlgFields"></div>
    <div class="actions">
      <button type="button" class="btn" id="dlgCancel">Huỷ</button>
      <button type="submit" class="btn primary">Lưu</button>
    </div>
  </form>
</dialog>
<div class="viewer" id="viewer">
  <div class="v-panel">
    <div class="v-bar">
      <b id="vTitle"></b>
      <a class="btn" id="vOpen" href="#" target="_blank" rel="noopener" title="Mở trong tab mới"></a>
      <button class="icon-btn" id="vClose" title="Đóng (Esc)"></button>
    </div>
    <div class="v-body">
      <div class="v-hint">Đang tải…<br>Nếu trang không hiện (một số web chặn nhúng), bấm “Tab mới” ở phía trên.</div>
      <iframe id="vFrame" title="Nội dung bài học" allow="autoplay; fullscreen; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>
</div>
<!-- Đồng hồ đếm ngược nổi -->
<div class="tm" id="timer">
  <div class="tm-clock" id="tmClock" title="Kéo để di chuyển">
    <svg class="ring" viewBox="0 0 120 120">
      <circle class="tm-track" cx="60" cy="60" r="54"/>
      <circle class="tm-prog" id="tmProg" cx="60" cy="60" r="54"/>
    </svg>
    <button class="icon-btn tm-min" id="tmMin" title="Thu nhỏ"></button>
    <div class="tm-center">
      <div class="tm-time" id="tmTime">30:00</div>
      <button class="tm-go" id="tmGo" title="Bắt đầu / Tạm dừng"></button>
    </div>
  </div>
  <div class="tm-set" id="tmSet">
    <div class="tm-presets">
      <button class="tm-chip" data-m="5">5</button>
      <button class="tm-chip" data-m="10">10</button>
      <button class="tm-chip" data-m="15">15</button>
      <button class="tm-chip on" data-m="30">30</button>
    </div>
    <div class="tm-custom">
      <input id="tmMinutes" type="number" min="1" max="99" step="1" value="30" inputmode="numeric" aria-label="Số phút">
      <span>phút</span>
      <button class="icon-btn" id="tmReset" title="Đặt lại"></button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const DB = "https://gametienganh-9af04-default-rtdb.asia-southeast1.firebasedatabase.app";
const ROOT = "lessonLinks";

let data = {};
let currentClass = null;
const expanded = new Set(); // Unit nào đang mở (mặc định tất cả thu gọn)

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const P = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>',
  ext:'<path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/>',
  refresh:'<path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z"/><path d="M4 19.5V21h16"/>',
  game:'<path d="M6 12h4M8 10v4"/><path d="M15 13h.01M18 11h.01"/><path d="M7 7h10a5 5 0 015 5v1a4 4 0 01-7 2.6l-.6-.6H9.6l-.6.6A4 4 0 012 13v-1a5 5 0 015-5z"/>',
  video:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
  link:'<path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24">${P[n]}</svg>`;

$("logoIc").innerHTML = ic("book");
$("refreshBtn").innerHTML = ic("refresh");
$("addClassBtn").innerHTML = ic("plus") + " Lớp";

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function setStatus(s, cls=""){ const el=$("status"); el.textContent=s; el.className="pill "+cls; }

async function api(method, path, body){
  const res = await fetch(`${DB}/${ROOT}${path}.json`, {
    method,
    headers: body !== undefined ? {"Content-Type":"application/json"} : undefined,
    body: body !== undefined ? JSON.stringify(body) : undefined
  });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
async function run(fn, okMsg){
  try{
    setStatus("Đang lưu…","busy");
    await fn();
    await load(true);
    if(okMsg) toast(okMsg);
  }catch(e){
    setStatus("Lỗi lưu","err");
    toast("Lỗi: " + e.message + " (kiểm tra Rules Firebase)");
  }
}
async function load(silent){
  try{
    if(!silent) setStatus("Đang tải…","busy");
    data = (await api("GET", "/classes")) || {};
    setStatus("Đã đồng bộ");
    if(!currentClass || !data[currentClass]){
      let saved = null; try{ saved = localStorage.getItem("currentClass"); }catch(e){}
      currentClass = (saved && data[saved]) ? saved : (sortedKeys(data)[0] || null);
    }
    render();
  }catch(e){
    setStatus("Mất kết nối","err");
    $("main").innerHTML = `<div class="empty">Không tải được dữ liệu.<br>${esc(e.message)}<br><small>Kiểm tra Rules của Realtime Database cho phép đọc/ghi.</small></div>`;
  }
}
const sortedKeys = obj => Object.keys(obj||{}).sort((a,b)=>(obj[a].createdAt||0)-(obj[b].createdAt||0));
const hueOf = i => (i*47 + 235) % 360;
const initials = n => { const w = String(n).trim().split(/\s+/); return (w[w.length-1]||"?").slice(0,3).toUpperCase(); };
const domain = u => { try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; } };
function kindOf(u){
  let h = ""; try{ h = new URL(u).hostname.toLowerCase(); }catch(e){ return null; }
  const is = d => h === d || h.endsWith("." + d);
  if(is("wordwall.net")) return {cls:"game", icon:"game", label:"Game"};
  if(is("youtube.com") || is("youtu.be") || is("youtube-nocookie.com")) return {cls:"video", icon:"video", label:"Video"};
  return null;
}
const unitNum = name => { const m = /(\d+)/.exec(name); return m ? m[1] : null; };

function render(){
  const keys = sortedKeys(data);
  $("classList").innerHTML = keys.map((id,i) => {
    const n = Object.keys(data[id].units||{}).length;
    return `<div class="class-item ${id===currentClass?'active':''}" data-class="${id}">
      <div class="avatar" style="--h:${hueOf(i)}">${esc(initials(data[id].name))}</div>
      <div class="t"><b>${esc(data[id].name)}</b><small>${n} unit</small></div></div>`;
  }).join("") || `<div class="none" style="border:none;padding:8px 6px">Chưa có lớp</div>`;

  const main = $("main");
  const cls = data[currentClass];
  if(!cls){ main.innerHTML = `<div class="empty">Hãy bấm <b>+ Lớp</b> để bắt đầu.</div>`; return; }

  const units = cls.units || {};
  const uk = sortedKeys(units);
  const totalLessons = uk.reduce((s,u)=>s+Object.keys(units[u].lessons||{}).length,0);

  main.innerHTML = `
    <div class="hero">
      <div class="info"><h2>${esc(cls.name)}</h2><p>${uk.length} Unit · ${totalLessons} bài học</p></div>
      <div class="acts">
        <button class="btn" data-act="editClass">${ic("edit")} Đổi tên</button>
        <button class="btn" data-act="delClass">${ic("trash")} Xoá</button>
        <button class="btn white" data-act="addUnit">${ic("plus")} Thêm Unit</button>
      </div>
    </div>
    ${uk.map((uid,i) => {
      const u = units[uid], lessons = u.lessons || {}, lk = sortedKeys(lessons);
      return `
      <section class="unit ${expanded.has(uid)?'':'collapsed'}" data-unit="${uid}" style="--h:${hueOf(i)}">
        <div class="unit-head" data-act="toggle">
          <div class="badge">${esc(unitNum(u.name) || i+1)}</div>
          <h3>${esc(u.name)}</h3>
          <span class="count">${lk.length} lesson</span>
          <div class="tools">
            <button class="icon-btn" data-act="editUnit" title="Đổi tên Unit">${ic("edit")}</button>
            <button class="icon-btn del" data-act="delUnit" title="Xoá Unit">${ic("trash")}</button>
          </div>
          <span class="chev">${ic("chev")}</span>
        </div>
        <div class="unit-body">
          ${lk.map((lid,j) => { const l = lessons[lid]; return `
            <div class="lesson" data-lesson="${lid}">
              <div class="num">${j+1}</div>
              <a class="name" data-act="open" href="${esc(l.url)}" target="_blank" rel="noopener">
                <b>${esc(l.title)}</b><small>${ic("link")} ${esc(domain(l.url))}</small>
              </a>
              ${(()=>{ const k = kindOf(l.url); return k ? `<span class="tag ${k.cls}">${ic(k.icon)} ${k.label}</span>` : ""; })()}
              <div class="tools">
                <button class="icon-btn" data-act="copyLesson" title="Copy link">${ic("copy")}</button>
                <button class="icon-btn" data-act="editLesson" title="Sửa">${ic("edit")}</button>
                <button class="icon-btn del" data-act="delLesson" title="Xoá">${ic("trash")}</button>
              </div>
              <a class="icon-btn" href="${esc(l.url)}" target="_blank" rel="noopener" title="Mở link">${ic("ext")}</a>
            </div>`; }).join("") || `<div class="none">Chưa có lesson nào.</div>`}
          <div class="unit-foot"><button class="btn dashed" data-act="addLesson">${ic("plus")} Thêm Lesson</button></div>
        </div>
      </section>`;
    }).join("") || `<div class="empty">Lớp này chưa có Unit. Bấm <b>Thêm Unit</b> để tạo.</div>`}
  `;
}

function openForm(title, fields, onSubmit){
  $("dlgTitle").textContent = title;
  $("dlgFields").innerHTML = fields.map((f,i)=>`
    <label for="f${i}">${esc(f.label)}</label>
    <input id="f${i}" type="text" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}" required autocomplete="off">`).join("");
  const dlg = $("dlg");
  $("dlgForm").onsubmit = e => {
    e.preventDefault();
    const vals = fields.map((_,i)=>$("f"+i).value.trim());
    dlg.close();
    onSubmit(...vals);
  };
  dlg.showModal();
  setTimeout(()=>$("f0")?.focus(), 30);
}
$("dlgCancel").onclick = () => $("dlg").close();

/* ===== Khung xem link ngay trong trang ===== */
$("vOpen").innerHTML = ic("ext") + " Tab mới";
$("vClose").innerHTML = ic("close");
function embedUrl(u){
  try{
    const x = new URL(u), h = x.hostname.replace(/^www\./,"").toLowerCase(), q = encodeURIComponent;
    const yt = (id, extra="") => `https://www.youtube.com/embed/${q(id)}?autoplay=1&rel=0${extra}`;
    if(h === "youtu.be" && x.pathname.length > 1) return yt(x.pathname.slice(1));
    if(h === "youtube.com" || h.endsWith(".youtube.com")){
      const v = x.searchParams.get("v"), list = x.searchParams.get("list");
      if(x.pathname === "/watch" && v) return yt(v, list ? "&list=" + q(list) : "");
      if(x.pathname === "/playlist" && list) return `https://www.youtube.com/embed/videoseries?list=${q(list)}&autoplay=1`;
      const m = /^\/(shorts|live|embed)\/([^/?]+)/.exec(x.pathname);
      if(m) return yt(m[2]);
    }
  }catch(e){}
  return u;
}
function openViewer(title, url){
  $("vTitle").textContent = title;
  $("vOpen").href = url;
  $("vFrame").src = embedUrl(url);
  $("viewer").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeViewer(){
  $("viewer").classList.remove("open");
  $("vFrame").src = "about:blank";
  document.body.style.overflow = "";
}
$("vClose").onclick = closeViewer;
$("viewer").onclick = e => { if(e.target === $("viewer")) closeViewer(); };
addEventListener("keydown", e => { if(e.key === "Escape" && $("viewer").classList.contains("open") && !$("dlg").open) closeViewer(); });
const fixUrl = u => /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : "https://" + u;

$("addClassBtn").onclick = () => openForm("Thêm lớp", [{label:"Tên lớp", placeholder:"VD: Lớp 3A"}], name =>
  run(async()=>{ const r = await api("POST","/classes",{name, createdAt:Date.now()}); currentClass = r.name; try{localStorage.setItem("currentClass",currentClass)}catch(e){} }, "Đã thêm lớp"));
$("refreshBtn").onclick = () => load();

$("classList").onclick = e => {
  const it = e.target.closest("[data-class]"); if(!it) return;
  currentClass = it.dataset.class;
  try{localStorage.setItem("currentClass",currentClass)}catch(e){}
  render();
};

$("main").onclick = e => {
  const btn = e.target.closest("[data-act]"); if(!btn) return;
  const act = btn.dataset.act;
  const cid = currentClass, cls = data[cid];
  const uid = btn.closest("[data-unit]")?.dataset.unit;
  const lid = btn.closest("[data-lesson]")?.dataset.lesson;

  if(act==="open"){
    if(e.ctrlKey || e.metaKey || e.shiftKey) return; // giữ thao tác mở tab mới
    e.preventDefault();
    const l = cls.units[uid].lessons[lid]; openViewer(l.title, l.url); return;
  }
  if(uid && /Lesson$/.test(act)) expanded.add(uid); // thêm/sửa/xoá lesson thì giữ Unit đang mở
  if(act==="toggle"){ expanded.has(uid) ? expanded.delete(uid) : expanded.add(uid); btn.closest(".unit").classList.toggle("collapsed"); return; }
  if(act==="editClass") openForm("Đổi tên lớp",[{label:"Tên lớp",value:cls.name}], name=>run(()=>api("PATCH",`/classes/${cid}`,{name}),"Đã cập nhật"));
  if(act==="delClass" && confirm(`Xoá lớp "${cls.name}" và toàn bộ Unit/Lesson?`)) run(async()=>{ await api("DELETE",`/classes/${cid}`); currentClass=null; },"Đã xoá lớp");
  if(act==="addUnit") openForm("Thêm Unit",[{label:"Tên Unit",placeholder:"VD: Unit 1 - Hello"}], name=>run(()=>api("POST",`/classes/${cid}/units`,{name,createdAt:Date.now()}),"Đã thêm Unit"));
  if(act==="editUnit") openForm("Đổi tên Unit",[{label:"Tên Unit",value:cls.units[uid].name}], name=>run(()=>api("PATCH",`/classes/${cid}/units/${uid}`,{name}),"Đã cập nhật"));
  if(act==="delUnit" && confirm(`Xoá "${cls.units[uid].name}" và các Lesson trong đó?`)) run(()=>api("DELETE",`/classes/${cid}/units/${uid}`),"Đã xoá Unit");
  if(act==="addLesson") openForm("Thêm Lesson",[{label:"Tên Lesson",placeholder:"VD: Lesson 1 - Vocabulary"},{label:"Link bài học",placeholder:"https://..."}], (title,url)=>run(()=>api("POST",`/classes/${cid}/units/${uid}/lessons`,{title,url:fixUrl(url),createdAt:Date.now()}),"Đã thêm Lesson"));
  if(act==="editLesson"){ const l = cls.units[uid].lessons[lid];
    openForm("Sửa Lesson",[{label:"Tên Lesson",value:l.title},{label:"Link bài học",value:l.url}], (title,url)=>run(()=>api("PATCH",`/classes/${cid}/units/${uid}/lessons/${lid}`,{title,url:fixUrl(url)}),"Đã cập nhật")); }
  if(act==="delLesson" && confirm("Xoá lesson này?")) run(()=>api("DELETE",`/classes/${cid}/units/${uid}/lessons/${lid}`),"Đã xoá Lesson");
  if(act==="copyLesson"){ const url = cls.units[uid].lessons[lid].url;
    (navigator.clipboard?.writeText(url) || Promise.reject()).then(()=>toast("Đã copy link"),()=>toast("Không copy được")); }
};

/* ===== Đồng hồ đếm ngược nổi ===== */
(function(){
  P.play  = '<path d="M7 4.5v15l12-7.5z"/>';
  P.pause = '<path d="M8 5v14M16 5v14"/>';
  P.reset = '<path d="M3 12a9 9 0 109-9 9 9 0 00-6.7 3L3 8M3 3v5h5"/>';

  const root = $("timer"), time = $("tmTime"), prog = $("tmProg"),
        go = $("tmGo"), inp = $("tmMinutes");
  const C = 2 * Math.PI * 54;
  prog.style.strokeDasharray = C;
  $("tmMin").innerHTML = ic("chev");
  $("tmReset").innerHTML = ic("reset");

  let total = 30 * 60000, remainMs = total, endAt = 0, timer = null, audio = null;

  function draw(){
    const sec = Math.ceil(remainMs / 1000);
    time.textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
    prog.style.strokeDashoffset = root.classList.contains("done") ? 0 : C * (1 - remainMs / total);
    go.innerHTML = ic(timer ? "pause" : "play");
  }
  function ensureAudio(){
    try{
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === "suspended") audio.resume();
    }catch(e){}
  }
  function beep(){
    try{
      ensureAudio();
      [0, .35, .7].forEach(t => {
        const o = audio.createOscillator(), g = audio.createGain(), s = audio.currentTime + t;
        o.type = "sine"; o.frequency.value = 880;
        o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(.0001, s);
        g.gain.exponentialRampToValueAtTime(.4, s + .02);
        g.gain.exponentialRampToValueAtTime(.0001, s + .28);
        o.start(s); o.stop(s + .3);
      });
    }catch(e){}
  }
  function stopTick(){ clearInterval(timer); timer = null; }
  function tick(){
    remainMs = Math.max(0, endAt - Date.now());
    if(remainMs <= 0){
      stopTick(); root.classList.add("done"); draw(); beep(); toast("⏰ Hết giờ rồi!");
      return;
    }
    draw();
  }
  function start(){
    ensureAudio();
    root.classList.remove("done");
    if(remainMs <= 0) remainMs = total;
    endAt = Date.now() + remainMs;
    timer = setInterval(tick, 100);
    tick();
  }
  function pause(){
    remainMs = Math.max(0, endAt - Date.now());
    stopTick(); draw();
  }
  function setMin(m){
    m = Math.min(99, Math.max(1, Math.round(Number(m)) || 1));
    inp.value = m;
    stopTick(); root.classList.remove("done");
    total = remainMs = m * 60000;
    document.querySelectorAll(".tm-chip").forEach(c => c.classList.toggle("on", Number(c.dataset.m) === m));
    draw();
  }

  go.onclick = () => timer ? pause() : start();
  $("tmReset").onclick = () => setMin(inp.value);
  inp.onchange = () => setMin(inp.value);
  inp.onkeydown = e => { if(e.key === "Enter"){ setMin(inp.value); inp.blur(); } };
  document.querySelectorAll(".tm-chip").forEach(c => c.onclick = () => setMin(c.dataset.m));
  $("tmMin").onclick = () => { root.classList.add("mini"); keepIn(); };

  /* Kéo thả */
  let drag = null;
  function keepIn(){
    if(!root.style.left) return;
    root.style.left = Math.min(Math.max(0, parseFloat(root.style.left)), Math.max(0, innerWidth - root.offsetWidth)) + "px";
    root.style.top  = Math.min(Math.max(0, parseFloat(root.style.top)),  Math.max(0, innerHeight - root.offsetHeight)) + "px";
  }
  root.addEventListener("pointerdown", e => {
    if(root.classList.contains("done")){ root.classList.remove("done"); draw(); }
    if(e.target.closest("button,input")) return;
    const r = root.getBoundingClientRect();
    drag = {dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, moved: false};
    try{ root.setPointerCapture(e.pointerId); }catch(_){}
  });
  root.addEventListener("pointermove", e => {
    if(!drag) return;
    if(!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
    drag.moved = true;
    root.classList.add("dragging");
    root.style.right = "auto"; root.style.bottom = "auto";
    root.style.left = Math.min(Math.max(0, e.clientX - drag.dx), Math.max(0, innerWidth - root.offsetWidth)) + "px";
    root.style.top  = Math.min(Math.max(0, e.clientY - drag.dy), Math.max(0, innerHeight - root.offsetHeight)) + "px";
  });
  function endDrag(){
    if(drag && !drag.moved && root.classList.contains("mini")){ root.classList.remove("mini"); keepIn(); }
    drag = null; root.classList.remove("dragging");
  }
  root.addEventListener("pointerup", endDrag);
  root.addEventListener("pointercancel", endDrag);
  addEventListener("resize", keepIn);

  setMin(30);
  if(matchMedia("(max-width:760px)").matches) root.classList.add("mini"); // điện thoại: mặc định thu nhỏ
})();

load();
</script>
